name: Test

on:
  pull_request:
  push:
    branches:
      - 'cursor/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: npm test
      - name: Cache version matches package.json
        run: npm run check-version

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Safari-engine and Chromium interaction, offline and upgrade tests
        env:
          REQUIRE_WEBKIT: '1'
        run: |
          npm run test:browser
          npm run test:ui
      - name: iPhone viewport, safe areas, large text and four-page screenshots
        env:
          REQUIRE_WEBKIT: '1'
          UI_SCREENSHOT_DIR: mobile-qa
        run: npm run test:mobile
      - name: Preserve mobile QA screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-mobile-qa
          path: mobile-qa
          if-no-files-found: warn
