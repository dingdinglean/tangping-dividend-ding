name: Update market data

on:
  workflow_dispatch:
  schedule:
    # One watcher, plus one backup if that start is dropped. The job itself
    # waits until 16:00 or 13:00 America/New_York (so EST and EDT both work),
    # then polls until the new closes are in or until 08:00 Asia/Shanghai.
    # 18:05 UTC is a few hours before either cash close. A delayed start still
    # falls inside the Beijing morning. 22:40 UTC (06:40 Shanghai) is only the
    # safety start when the watcher never began.
    - cron: '5 18 * * 1-5'
    - cron: '40 22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh public snapshot
        id: refresh
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: node scripts/update-market-data.mjs
      - name: Commit snapshot only when changed
        if: steps.refresh.outcome == 'success' || steps.refresh.outcome == 'failure'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- data/market.json
          if git diff --cached --quiet; then
            echo "No snapshot changes; no commit created."
            exit 0
          fi
          MESSAGE=$(node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";
          const snapshot = JSON.parse(readFileSync("data/market.json", "utf8"));
          const day = snapshot.refresh?.target_price_date || "unknown";
          const held = [...new Set(Object.values(snapshot.symbols || {}).map((row) => row.price?.price_date).filter(Boolean))].join(",");
          const current = snapshot.refresh?.freshness === "current";
          console.log(current ? `chore: update public market snapshot (${day})` : `chore: update public market snapshot (stale, expected ${day}, held ${held})`);
          EOF
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$MESSAGE"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
