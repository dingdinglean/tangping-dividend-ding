name: Update market data

on:
  workflow_dispatch:
  schedule:
    # Watcher. 18:05 UTC is 02:05 Asia/Shanghai, before the 16:00 or 13:00
    # America/New_York cash close. The job waits until 10 minutes after that
    # close, then polls until 08:00 Asia/Shanghai.
    - cron: '5 18 * * 1-5'
    # Independent backup if the watcher event is never created. It uses its
    # own concurrency group so a sleeping watcher cannot queue it.
    - cron: '40 22 * * 1-5'
    # One idempotent compensation after the in-job Beijing deadline:
    # 00:17 UTC Tue-Sat is 08:17 Asia/Shanghai. If the session is already
    # current this run does not commit. GitHub can still drop this event;
    # extra cron lines are not a delivery guarantee.
    - cron: '17 0 * * 2-6'

permissions:
  contents: write

# One group per cron (or per manual dispatch). cancel-in-progress stays off
# so a delayed duplicate does not kill a run that is waiting for the close.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record scheduler evidence
        if: always()
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          {
            echo "## Scheduler evidence"
            echo
            echo "- event: \`${{ github.event_name }}\`"
            echo "- schedule: \`${SCHEDULE_CRON:-workflow_dispatch}\`"
            echo "- actor: \`${{ github.actor }}\`"
            echo "- triggering_actor: \`${{ github.triggering_actor }}\`"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- run_attempt: ${{ github.run_attempt }}"
            echo "- ref: \`${{ github.ref }}\`"
            echo "- sha: \`${{ github.sha }}\`"
            echo "- workflow_id: 350907457"
            echo
            echo "Official windows remain \`5 18 * * 1-5\` and \`40 22 * * 1-5\` UTC. Compensation is \`17 0 * * 2-6\` UTC (08:17 Asia/Shanghai), after the 08:00 deadline. A dropped schedule creates no run, so this log cannot prove an earlier tick was accepted."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh public snapshot
        id: refresh
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: node scripts/update-market-data.mjs
      - name: Commit snapshot only when changed
        if: steps.refresh.outcome == 'success' || steps.refresh.outcome == 'failure'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/commit-market-snapshot.mjs
      - name: Fail unless the expected session was reached
        if: steps.refresh.outcome != 'success'
        run: |
          echo "The refresh did not align with the expected completed session. A recordable stale snapshot may already have been committed. Push errors fail the commit step. This step keeps the job red."
          exit 1
