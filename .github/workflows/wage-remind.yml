name: Wage remind

# 独立于行情快照。此工作流只读仓库、不提交文件。
# 发送状态放在 Actions cache，避免把每次推送写进 main。
# 代码侧还有 Asia/Shanghai 发送窗口（早 07:30–09:30 / 晚 17:30–19:30），
# 防止 GitHub Actions 延迟把下班「今日收入」推到凌晨。
on:
  schedule:
    # 08:05 Asia/Shanghai。中国无夏令时，对应 UTC 00:05。
    - cron: '5 0 * * *'
    # 18:05 Asia/Shanghai，对应 UTC 10:05。
    - cron: '5 10 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 发送哪一条
        type: choice
        options:
          - test
          - morning
          - evening
        default: test
      force:
        description: 忽略工作日、开关和防重复（仅手动排查）
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: wage-remind
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore reminder state
        uses: actions/cache/restore@v4
        with:
          path: wage-remind/.state
          key: wage-remind-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wage-remind-state-
      - name: Send wage reminder
        env:
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
          WAGE_EVENT: ${{ github.event_name }}
          WAGE_SCHEDULE: ${{ github.event.schedule }}
          WAGE_SLOT: ${{ inputs.slot }}
          WAGE_FORCE: ${{ inputs.force }}
        run: node wage-remind/cli.mjs
      - name: Save reminder state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: wage-remind/.state
          key: wage-remind-state-${{ github.run_id }}-${{ github.run_attempt }}
